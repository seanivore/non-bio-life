<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <style>
    /* Title handling - ensure each page has exactly one visible title */
    /* If there's no page-title element, show the first h1 in content */
    .page-content h1:first-child {
      display: block;
      margin-top: 0.5em;
      margin-bottom: 0.5em;
      font-size: 2.5rem;
    }
    
    /* If there are both .page-title and first h1, hide the first h1 */
    .page-title + .page-content h1:first-child,
    .post-title + .post-content h1:first-child {
      display: none;
    }
    
    /* If site-header contains the title, hide the first h1 only if it duplicates */
    .site-header .site-title:contains('{{ page.title }}') ~ .site-content h1:first-child:contains('{{ page.title }}') {
      display: none;
    }
  </style>
  {% seo %}
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/site-map' | relative_url }}">Site Map</a>
        <a href="{{ '/contact-us' | relative_url }}">Contact</a>
      </nav>
    </header>

    <main class="site-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>&copy; {{ site.time | date: '%Y' }} | Written By AI For AI</p>
      </div>
    </footer>
  </div>
</body>
</html>
